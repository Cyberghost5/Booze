<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
        <!-- Background Radial Ambient Glow -->
        <radialGradient id="bgGlow_la-casera-apple" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#84cc16" stop-opacity="0.30"/>
            <stop offset="60%" stop-color="#84cc16" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#0b0b0e" stop-opacity="1"/>
        </radialGradient>
        <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#141418"/>
            <stop offset="100%" stop-color="#09090c"/>
        </linearGradient>
    </defs>

    <!-- Canvas Background -->
    <rect width="600" height="600" fill="url(#cardBg)"/>
    <rect width="600" height="600" fill="url(#bgGlow_la-casera-apple)"/>

    <!-- Subtle Background Grid Pattern -->
    <g opacity="0.04" stroke="#ffffff" stroke-width="1">
        <line x1="0" y1="150" x2="600" y2="150"/>
        <line x1="0" y1="300" x2="600" y2="300"/>
        <line x1="0" y1="450" x2="600" y2="450"/>
        <line x1="150" y1="0" x2="150" y2="600"/>
        <line x1="300" y1="0" x2="300" y2="600"/>
        <line x1="450" y1="0" x2="450" y2="600"/>
    </g>

                <!-- PET Soft Drink / Energy Bottle -->
            <g transform="translate(180, 80)">
                <ellipse cx="120" cy="440" rx="85" ry="16" fill="#000000" opacity="0.6"/>
                <!-- Plastic Cap -->
                <rect x="96" y="20" width="48" height="28" rx="6" fill="#4d7c0f" stroke="#ffffff" stroke-width="1.5"/>
                <!-- Neck & Shoulder -->
                <path d="M98 48 L142 48 L175 110 L65 110 Z" fill="#3f6212"/>
                <!-- Ribbed PET Body -->
                <rect x="65" y="110" width="110" height="315" rx="24" fill="#3f6212" stroke="#3f3f46" stroke-width="2"/>
                <rect x="75" y="115" width="16" height="305" rx="8" fill="#ffffff" opacity="0.18"/>

                <!-- Wrap Label -->
                <rect x="65" y="180" width="110" height="170" fill="#4d7c0f"/>
                <g transform="translate(120, 240)" text-anchor="middle">
                                    <path d="M0 -18 Q16 0 0 18 Q-16 0 0 -18 Z" fill="#fef08a"/>
                <line x1="0" y1="-12" x2="0" y2="12" stroke="#000000" opacity="0.3" stroke-width="2"/>
                    <text y="40" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="0.5">LA CASERA</text>
                    <text y="60" fill="#fef08a" opacity="0.9" font-family="system-ui, sans-serif" font-weight="700" font-size="8" letter-spacing="1">CARBONATED APPLE</text>
                </g>
            </g>

    <!-- Top Badge Volume Badge -->
    <g transform="translate(560, 40)" text-anchor="end">
        <rect x="-110" y="0" width="110" height="32" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
        <text x="-55" y="21" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-weight="800" font-size="12">50cl PET</text>
    </g>

    <!-- Bottom Authentic Brand Tag -->
    <g transform="translate(300, 560)" text-anchor="middle">
        <text y="0" fill="#a1a1aa" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="3">AUTHENTIC NIGERIAN DRINKS</text>
    </g>
</svg>