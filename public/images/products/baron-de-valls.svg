<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
        <!-- Background Radial Ambient Glow -->
        <radialGradient id="bgGlow_baron-de-valls" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.30"/>
            <stop offset="60%" stop-color="#b91c1c" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#0b0b0e" stop-opacity="1"/>
        </radialGradient>
        <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#141418"/>
            <stop offset="100%" stop-color="#09090c"/>
        </linearGradient>
    </defs>

    <!-- Canvas Background -->
    <rect width="600" height="600" fill="url(#cardBg)"/>
    <rect width="600" height="600" fill="url(#bgGlow_baron-de-valls)"/>

    <!-- Subtle Background Grid Pattern -->
    <g opacity="0.04" stroke="#ffffff" stroke-width="1">
        <line x1="0" y1="150" x2="600" y2="150"/>
        <line x1="0" y1="300" x2="600" y2="300"/>
        <line x1="0" y1="450" x2="600" y2="450"/>
        <line x1="150" y1="0" x2="150" y2="600"/>
        <line x1="300" y1="0" x2="300" y2="600"/>
        <line x1="450" y1="0" x2="450" y2="600"/>
    </g>

                <!-- Wine Bottle Silhouette -->
            <g transform="translate(185, 65)">
                <ellipse cx="115" cy="460" rx="80" ry="16" fill="#000000" opacity="0.6"/>
                <!-- Foil Capsule -->
                <rect x="98" y="15" width="34" height="60" rx="4" fill="#991b1b" stroke="#eab308" stroke-width="1"/>
                <!-- Long Neck -->
                <rect x="98" y="75" width="34" height="120" fill="#450a0a"/>
                <!-- Smooth Curved Shoulder -->
                <path d="M98 195 C98 230 45 245 45 270 L45 450 L185 450 L185 270 C185 245 132 230 132 195 Z" fill="#450a0a" stroke="#27272a" stroke-width="2"/>
                <!-- Glass Sheen -->
                <path d="M55 275 Q115 285 175 275 L175 440 L55 440 Z" fill="#ffffff" opacity="0.04"/>
                <rect x="55" y="275" width="18" height="165" rx="8" fill="#ffffff" opacity="0.15"/>

                <!-- Wine Body Label -->
                <rect x="62" y="295" width="106" height="135" rx="8" fill="#991b1b" stroke="#eab308" stroke-width="1.5"/>
                <g transform="translate(115, 340)" text-anchor="middle">
                                    <path d="M-14 -14 L14 -14 L14 2 C14 12 0 18 0 18 C0 18 -14 12 -14 2 Z" fill="#fef08a"/>
                    <text y="38" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="900" font-size="15" letter-spacing="0.5">BARON DE VALLS</text>
                    <text y="58" fill="#fef08a" opacity="0.9" font-family="system-ui, sans-serif" font-weight="700" font-size="8" letter-spacing="1">RED TABLE WINE</text>
                </g>
            </g>

    <!-- Top Badge Volume Badge -->
    <g transform="translate(560, 40)" text-anchor="end">
        <rect x="-110" y="0" width="110" height="32" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
        <text x="-55" y="21" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-weight="800" font-size="12">75cl</text>
    </g>

    <!-- Bottom Authentic Brand Tag -->
    <g transform="translate(300, 560)" text-anchor="middle">
        <text y="0" fill="#a1a1aa" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="3">AUTHENTIC NIGERIAN DRINKS</text>
    </g>
</svg>