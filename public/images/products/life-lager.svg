<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
        <!-- Background Radial Ambient Glow -->
        <radialGradient id="bgGlow_life-lager" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.30"/>
            <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#0b0b0e" stop-opacity="1"/>
        </radialGradient>
        <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#141418"/>
            <stop offset="100%" stop-color="#09090c"/>
        </linearGradient>
    </defs>

    <!-- Canvas Background -->
    <rect width="600" height="600" fill="url(#cardBg)"/>
    <rect width="600" height="600" fill="url(#bgGlow_life-lager)"/>

    <!-- Subtle Background Grid Pattern -->
    <g opacity="0.04" stroke="#ffffff" stroke-width="1">
        <line x1="0" y1="150" x2="600" y2="150"/>
        <line x1="0" y1="300" x2="600" y2="300"/>
        <line x1="0" y1="450" x2="600" y2="450"/>
        <line x1="150" y1="0" x2="150" y2="600"/>
        <line x1="300" y1="0" x2="300" y2="600"/>
        <line x1="450" y1="0" x2="450" y2="600"/>
    </g>

                <!-- Standard 600ml Lager Bottle -->
            <g transform="translate(180, 75)">
                <ellipse cx="120" cy="445" rx="85" ry="16" fill="#000000" opacity="0.6"/>
                <!-- Gold Crown Cap -->
                <rect x="100" y="15" width="40" height="22" rx="4" fill="#f59e0b" stroke="#ca8a04" stroke-width="2"/>
                <!-- Neck Foil Wrapper -->
                <path d="M102 37 L138 37 L145 110 L95 110 Z" fill="#0369a1" stroke="#f59e0b" stroke-width="1.5"/>
                <!-- Glass Bottle Body -->
                <path d="M95 110 L145 110 L190 170 L50 170 Z" fill="#1c1917" stroke="#3f3f46" stroke-width="1.5"/>
                <rect x="50" y="170" width="140" height="260" rx="20" fill="#1c1917" stroke="#3f3f46" stroke-width="2"/>
                <rect x="62" y="175" width="18" height="245" rx="9" fill="#ffffff" opacity="0.14"/>

                <!-- Front Oval Body Label -->
                <rect x="60" y="210" width="120" height="180" rx="20" fill="#0369a1" stroke="#f59e0b" stroke-width="2.5"/>
                <g transform="translate(120, 265)" text-anchor="middle">
                                    <path d="M-14 -14 L14 -14 L14 2 C14 12 0 18 0 18 C0 18 -14 12 -14 2 Z" fill="#facc15"/>
                    <text y="44" fill="#facc15" font-family="system-ui, sans-serif" font-weight="900" font-size="19" letter-spacing="1">LIFE</text>
                    <text y="68" fill="#facc15" opacity="0.9" font-family="system-ui, sans-serif" font-weight="700" font-size="9" letter-spacing="1.5">CONTINENTAL LAGER</text>
                </g>
            </g>

    <!-- Top Badge Volume Badge -->
    <g transform="translate(560, 40)" text-anchor="end">
        <rect x="-110" y="0" width="110" height="32" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
        <text x="-55" y="21" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-weight="800" font-size="12">600ml</text>
    </g>

    <!-- Bottom Authentic Brand Tag -->
    <g transform="translate(300, 560)" text-anchor="middle">
        <text y="0" fill="#a1a1aa" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="3">AUTHENTIC NIGERIAN DRINKS</text>
    </g>
</svg>