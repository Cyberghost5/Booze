<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
        <!-- Background Radial Ambient Glow -->
        <radialGradient id="bgGlow_seamans-schnapps" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
            <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#0b0b0e" stop-opacity="1"/>
        </radialGradient>
        <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#141418"/>
            <stop offset="100%" stop-color="#09090c"/>
        </linearGradient>
    </defs>

    <!-- Canvas Background -->
    <rect width="600" height="600" fill="url(#cardBg)"/>
    <rect width="600" height="600" fill="url(#bgGlow_seamans-schnapps)"/>

    <!-- Subtle Background Grid Pattern -->
    <g opacity="0.04" stroke="#ffffff" stroke-width="1">
        <line x1="0" y1="150" x2="600" y2="150"/>
        <line x1="0" y1="300" x2="600" y2="300"/>
        <line x1="0" y1="450" x2="600" y2="450"/>
        <line x1="150" y1="0" x2="150" y2="600"/>
        <line x1="300" y1="0" x2="300" y2="600"/>
        <line x1="450" y1="0" x2="450" y2="600"/>
    </g>

                <!-- Schnapps Bottle -->
            <g transform="translate(180, 80)">
                <ellipse cx="120" cy="440" rx="90" ry="16" fill="#000000" opacity="0.6"/>
                <!-- Cork Seal -->
                <rect x="105" y="15" width="30" height="25" rx="4" fill="#b91c1c"/>
                <circle cx="120" cy="27" r="8" fill="#f59e0b"/>
                <!-- Long Clear Neck -->
                <rect x="102" y="40" width="36" height="110" fill="#f8fafc" stroke="#a1a1aa" stroke-width="1.5"/>
                <!-- Shoulder -->
                <path d="M102 150 L138 150 L195 210 L45 210 Z" fill="#f8fafc" stroke="#a1a1aa" stroke-width="1.5"/>
                <!-- Main Body -->
                <rect x="45" y="210" width="150" height="220" rx="12" fill="#f8fafc" stroke="#d4d4d8" stroke-width="2"/>
                <!-- Glass Sheen -->
                <rect x="55" y="215" width="18" height="210" rx="8" fill="#ffffff" opacity="0.25"/>

                <!-- Ceremonial Red Ribbon & Seal -->
                <path d="M120 150 L120 250" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
                <circle cx="120" cy="230" r="22" fill="#b91c1c" stroke="#f59e0b" stroke-width="2"/>
                <circle cx="120" cy="230" r="16" fill="#f59e0b"/>

                <!-- Front Label -->
                <rect x="60" y="270" width="120" height="140" rx="10" fill="#dc2626" stroke="#f59e0b" stroke-width="2"/>
                <g transform="translate(120, 310)" text-anchor="middle">
                                    <path d="M-18 -10 L-10 10 L0 -5 L10 10 L18 -10 L12 18 L-12 18 Z" fill="#ffffff"/>
                    <text y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="1">SEAMAN&#039;S</text>
                    <text y="58" fill="#ffffff" opacity="0.9" font-family="system-ui, sans-serif" font-weight="700" font-size="8" letter-spacing="1">AROMATIC SCHNAPPS</text>
                </g>
            </g>

    <!-- Top Badge Volume Badge -->
    <g transform="translate(560, 40)" text-anchor="end">
        <rect x="-110" y="0" width="110" height="32" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
        <text x="-55" y="21" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-weight="800" font-size="12">75cl</text>
    </g>

    <!-- Bottom Authentic Brand Tag -->
    <g transform="translate(300, 560)" text-anchor="middle">
        <text y="0" fill="#a1a1aa" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="3">AUTHENTIC NIGERIAN DRINKS</text>
    </g>
</svg>